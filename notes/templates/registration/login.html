{% extends "notes/base.html" %}

{% block title %}
    개발노트 로그인
{% endblock %}

{% block content %}
    <section class="login-container">
        <div class="page-header">
            <h1>로그인</h1>

            <p class="page-description">
                개발노트를 이용하려면 로그인하세요.
            </p>
        </div>

        <section class="card form-card login-card">
            {% if form.errors %}
                <div class="error-message">
                    사용자 이름 또는 비밀번호가 올바르지 않습니다.
                </div>
            {% endif %}

            <form method="post">
                {% csrf_token %}

                <div class="form-group login-field">
                    <label for="{{ form.username.id_for_label }}">
                        사용자 이름
                    </label>

                    {{ form.username }}
                </div>

                <div class="form-group login-field">
                    <label for="{{ form.password.id_for_label }}">
                        비밀번호
                    </label>

                    {{ form.password }}
                </div>

                {% if next %}
                    <input
                        type="hidden"
                        name="next"
                        value="{{ next }}"
                    >
                {% endif %}

                <div class="action-row">
                    <button
                        class="button button-primary login-button"
                        type="submit"
                    >
                        로그인
                    </button>
                </div>
            </form>
        </section>
    </section>
{% endblock %}
