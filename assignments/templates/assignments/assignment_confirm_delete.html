{% extends "notes/base.html" %}

{% block title %}
    과제 삭제
{% endblock %}

{% block content %}
    <section class="page-header">
        <h1>과제 삭제</h1>
    </section>

    <section class="card">
        <p>
            <strong>{{ assignment.title }}</strong>
            과제를 정말 삭제할까요?
            학생들의 제출물도 함께 삭제됩니다.
        </p>

        <form method="post">
            {% csrf_token %}

            <div class="action-row">
                <button
                    class="button button-danger"
                    type="submit"
                >
                    삭제
                </button>

                <a
                    class="button button-secondary"
                    href="{% url 'assignments:detail' assignment.pk %}"
                >
                    취소
                </a>
            </div>
        </form>
    </section>
{% endblock %}
