{% extends "notes/base.html" %}

{% block title %}
    질문 삭제
{% endblock %}

{% block content %}
    <section class="page-header">
        <h1>질문 삭제</h1>
    </section>

    <section class="card danger-card">
        <p>
            <strong>{{ question.content|truncatechars:60 }}</strong>
        </p>

        <p>
            이 질문을 정말 삭제할까요?
            답변이 있다면 함께 삭제됩니다.
        </p>

        <form method="post">
            {% csrf_token %}

            <div class="action-row">
                <button
                    class="button button-danger"
                    type="submit"
                >
                    삭제
                </button>

                <a
                    class="button button-secondary"
                    href="{% url 'qna:detail' question.pk %}"
                >
                    취소
                </a>
            </div>
        </form>
    </section>
{% endblock %}
